name: Daten aktualisieren

# Monatlich: Medianeinkommen (Eurostat) und, soweit erreichbar, die amtlichen Haushaltsdateien
# (bundeshaushalt.de) neu berechnen und bei Änderungen einen Pull Request zur Prüfung öffnen.
# Veröffentlicht wird erst, wenn jemand den Pull Request zusammenführt.
#
# Hinweis: bundeshaushalt.de beantwortet Anfragen von GitHub-Servern derzeit mit HTTP 503.
# Dann wird der Haushaltsteil übersprungen (Warnung im Lauf) und muss lokal mit
# pipeline/aktualisieren.sh aktualisiert werden. Echte Datenfehler lassen den Lauf scheitern.

on:
  schedule:
    - cron: "17 4 5 * *"   # am 5. jedes Monats, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daten-aktualisieren
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Haushaltsdaten neu berechnen
        run: |
          set +e
          python3 pipeline/haushalt.py && python3 pipeline/sondervermoegen.py
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::warning title=bundeshaushalt.de nicht erreichbar::Die Haushaltsdaten wurden nicht abgeglichen. Lokal ausführen: bash pipeline/aktualisieren.sh"
            printf '\nHaushaltsdaten: bundeshaushalt.de war vom GitHub-Server aus nicht erreichbar, nicht abgeglichen.\n' >> pipeline/bericht.md
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: Medianeinkommen und Bund insgesamt von Eurostat
        run: |
          python3 pipeline/median.py
          python3 pipeline/gesamtstaat.py

      - name: Pull Request bei Änderungen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat pipeline/bericht.md >> "$GITHUB_STEP_SUMMARY" || true
          if git diff --quiet -- data; then
            echo "Keine Änderungen an den Daten."
            exit 0
          fi
          branch="daten/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data
          git commit -m "Daten aktualisiert ($(date -u +%Y-%m-%d))"
          git push --force -u origin "$branch"
          {
            echo "Automatischer Abgleich mit den amtlichen Quellen. Bitte vor dem Zusammenführen prüfen:"
            echo
            echo "- Sind die geänderten Werte plausibel (neues Haushaltsjahr, neue Haushaltsrechnung, Revision)?"
            echo "- Stimmen Texte auf der Seite noch, die Jahre nennen (z. B. „2015–2026“)?"
            echo
            cat pipeline/bericht.md
          } > /tmp/pr.md
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --body-file /tmp/pr.md
          else
            gh pr create --base main --head "$branch" --title "Daten aktualisiert ($(date -u +%Y-%m-%d))" --body-file /tmp/pr.md
          fi
